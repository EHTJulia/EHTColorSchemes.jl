name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: lts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Matplotlib for PyPlot
        run: python -m pip install 'matplotlib>=3.7,<4'
      - name: Prepare PyPlot environment
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          "$PYTHON" -c 'import matplotlib; print(matplotlib.__version__)'
          julia --project=docs/profiles/pyplot -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.build("PyCall")'
          julia --project=docs/profiles/pyplot -e 'using PyPlot; println("PyCall Python: ", PyPlot.PyCall.pyprogramname); @assert realpath(PyPlot.PyCall.pyprogramname) == realpath(ENV["PYTHON"]); println("Matplotlib: ", PyPlot.matplotlib.__version__)'
      - name: Prepare documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Build all plotting profiles
        env:
          GKSwstype: '100'
          MPLBACKEND: Agg
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: xvfb-run -a julia --project=docs docs/make.jl all
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: .docs-build/
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: lts
      - run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: .docs-build
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs -e 'using Documenter; deploydocs(repo="github.com/EHTJulia/EHTColorSchemes.jl.git", target=".docs-build", devbranch="main")'
